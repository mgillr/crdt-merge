name: CRDT Law Verification

on:
  push:
    branches: [main, develop]
    paths:
      - 'crdt_merge/model/**'
      - 'crdt_merge/core.py'
      - 'crdt_merge/e4/integration/agent_bridge.py'
      - 'tests/test_crdt_properties.py'
      - 'tests/test_crdt_state.py'
      - 'tests/test_orset_lwwmap_correctness.py'
      - 'tests/test_trust_agent_state_delete.py'
      - 'tests/test_crdt_state_tag_uniqueness.py'
  pull_request:
    branches: [main]
    paths:
      - 'crdt_merge/model/**'
      - 'crdt_merge/core.py'
      - 'crdt_merge/e4/integration/agent_bridge.py'
      - 'tests/test_crdt_properties.py'
      - 'tests/test_crdt_state.py'
      - 'tests/test_orset_lwwmap_correctness.py'
      - 'tests/test_trust_agent_state_delete.py'
      - 'tests/test_crdt_state_tag_uniqueness.py'

jobs:
  crdt-law-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[model,dev,crypto]"

      - name: Run CRDT law tests
        run: |
          pytest tests/test_crdt_properties.py tests/test_crdt_state.py \
            tests/test_orset_lwwmap_correctness.py \
            tests/test_trust_agent_state_delete.py \
            tests/test_crdt_state_tag_uniqueness.py -q --tb=short
